version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # eslint 10 cannot be installed alongside eslint-plugin-react, which
      # caps its peer at `^9.7` — `npm ci` fails with ERESOLVE before any job
      # runs. react-x11 carries the same hold and the same reason: the
      # plugin's `react/jsx-uses-react` and `react/jsx-uses-vars` are what
      # stop `no-unused-vars` flagging every JSX-referenced identifier.
      # Lift once jsx-eslint/eslint-plugin-react#3977 ships.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # released in lockstep with eslint, so holding one holds both
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # linebreak 2 has a named export where 1 had a default, and breaks by
      # UAX #14 revision 45's LB22 and Unicode 15's classes. ntk and
      # react-x11 still break every line with 1.1.0, and `text-wrap: pretty`
      # reads its break points from linebreak so that they are the engines'
      # (src/html/layout/pretty.ts): on 2 they would not be, and every app
      # would install both. Lift once ntk and react-x11 have moved, in that
      # order, and change the import and src/html/linebreak.d.ts with it.
      - dependency-name: linebreak
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
